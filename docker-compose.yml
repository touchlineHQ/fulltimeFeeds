version: '3.8'

services:
  scraper:
    build: .
    image: yel-scraper:latest
    container_name: yel_scraper_container
    # Automatically injects all variables found in your local .env file
    env_file:
      - .env
    # Persist published feeds/calendars across runs so a league that fails to
    # fetch one run keeps its previously published data (and stays in index.json).
    volumes:
      - scraper_feeds:/app/feeds
      - scraper_calendars:/app/calendars

volumes:
  scraper_feeds:
  scraper_calendars: